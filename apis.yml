aid: linearlabsinc
name: Linear Labs
description: Linear Labs is an industrial motor technology company headquartered in Fort Worth, Texas,
  building high-torque motor systems for wind, nuclear, pumps, actuators, mining, and defense
  applications. Its patented Hunstable Electric Turbine (HET) permanent-magnet architecture uses a
  circumferential flux design the company states delivers 2x torque density, 97% peak efficiency, and
  50% weight reduction versus conventional motors, scaling from 10 kW to 2.2 MW. Its PitchPro 2000 is a
  complete pitch-system replacement for aging GE 1.5 wind turbines, pairing the HET motor with KEBA
  drive electronics, a Bachmann PLC controller, and ultracapacitor backup power. Linear Labs is a
  hardware manufacturer and publishes no public API, developer portal, or machine-readable technical
  surface; this profile is maintained for network coverage and identity only.
